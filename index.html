<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Bloom</title>
    <!-- Inline so the logo shows the instant the page opens, before the game code downloads. -->
    <style>
      html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #262a6b 0%, #33296a 45%, #164a5a 100%); }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vmin; z-index: 10; transition: opacity 0.3s; }
      #splash .row { display: flex; gap: 1.2vmin; }
      #splash b {
        width: 11vmin; height: 11vmin; max-width: 72px; max-height: 72px; border-radius: 20%;
        display: flex; align-items: center; justify-content: center;
        font: 700 min(7vmin, 46px) Fredoka, 'Arial Rounded MT Bold', system-ui, sans-serif; color: #fff;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); box-shadow: inset 0 -0.9vmin 0 rgba(0, 0, 0, 0.3), inset 0 0.6vmin 0 rgba(255, 255, 255, 0.25);
        animation: drop 0.5s cubic-bezier(0.3, 1.5, 0.6, 1) both;
      }
      #splash .bar { margin-top: 5vmin; width: 30vmin; max-width: 200px; height: 8px; border-radius: 4px; background: rgba(11, 14, 51, 0.5); overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #3ccf6e; animation: load 1.1s ease-in-out infinite; }
      @keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading Block Bloom">
      <div class="row">
        <b style="background:#ff5c8a">B</b><b style="background:#ffb340;animation-delay:.05s">L</b><b style="background:#7ed957;animation-delay:.1s">O</b><b style="background:#4fc3f7;animation-delay:.15s">C</b><b style="background:#b388ff;animation-delay:.2s">K</b>
      </div>
      <div class="row">
        <b style="background:#7ed957;animation-delay:.25s">B</b><b style="background:#4fc3f7;animation-delay:.3s">L</b><b style="background:#b388ff;animation-delay:.35s">O</b><b style="background:#ff7f50;animation-delay:.4s">O</b><b style="background:#ff5c8a;animation-delay:.45s">M</b>
      </div>
      <div class="bar"><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
